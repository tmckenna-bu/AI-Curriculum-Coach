<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGSS AI Curriculum Coach</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/lucide-static@latest/font/lucide.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Lucide React icons as components
        const Send = () => <i data-lucide="send"></i>;
        const Lightbulb = () => <i data-lucide="lightbulb"></i>;
        const BarChart3 = () => <i data-lucide="bar-chart-3"></i>;
        const RefreshCw = () => <i data-lucide="refresh-cw"></i>;
        const FileText = () => <i data-lucide="file-text"></i>;

        // Initialize Lucide icons
        useEffect(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, []);
