
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGSS AI Curriculum Coach</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Send = ({ className = "w-5 h-5" }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        );

        const Lightbulb = ({ className = "w-5 h-5" }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
                <path d="M9 18h6"></path>
                <path d="M10 22h4"></path>
            </svg>
        );

        const BarChart3 = ({ className = "w-4 h-4" }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 3v18h18"></path>
                <path d="M18 17V9"></path>
                <path d="M13 17V5"></path>
                <path d="M8 17v-3"></path>
            </svg>
        );

        const RefreshCw = ({ className = "w-4 h-4" }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
        );

        const FileText = ({ className = "w-4 h-4" }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
        );

        const NGSSAICoach = () => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [teacherContext, setTeacherContext] = useState({
                gradeLevel: '',
                subject: '',
                experience: '',
                name: ''
            });
            const [showSetup, setShowSetup] = useState(true);
            const [needsApiKey, setNeedsApiKey] = useState(false);
            const [apiKey, setApiKey] = useState('');
            const [analytics, setAnalytics] = useState([]);
            const [uploadedDoc, setUploadedDoc] = useState(null);
            const [docContent, setDocContent] = useState('');
            const [showPasteArea, setShowPasteArea] = useState(false);
            const [pasteContent, setPasteContent] = useState('');
            const messagesEndRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const storedKey = localStorage.getItem('ngss_ai_key');
                if (storedKey) {
                    setApiKey(storedKey);
                } else {
                    setNeedsApiKey(true);
                }
            }, []);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const logInteraction = (question, response) => {
                const interaction = {
                    timestamp: new Date().toISOString(),
                    teacherContext: teacherContext,
                    question: question,
                    response: response,
                    hasDocument: !!docContent
                };
                setAnalytics(prev => [...prev, interaction]);
            };

            const callAI = async (userMessage) => {
                try {
                    const systemPrompt = `You are an expert NGSS (Next Generation Science Standards) instructional coach. Your role is to engage teachers in dialogic, reflective coaching conversations that build their professional judgment and capacity.

Core Coaching Principles:
- Use Socratic questioning rather than direct answers
- Prompt reflection on practice and student thinking
- Build on teachers' existing knowledge and experience
- Maintain a non-evaluative, supportive stance
- Focus on three-dimensional learning (practices, core ideas, crosscutting concepts)
- Encourage evidence-based reasoning
- Connect to specific curriculum context when available

Teacher Context:
- Name: ${teacherContext.name}
- Grade Level: ${teacherContext.gradeLevel}
- Subject: ${teacherContext.subject || 'General Science'}
- Experience: ${teacherContext.experience || 'Not specified'}

${docContent ? `CURRICULUM DOCUMENT LOADED:
The teacher has uploaded their curriculum materials. Reference this content when relevant:

${docContent.substring(0, 6000)}

When the teacher asks about their curriculum, ground your coaching in the specific content above.` : 'No curriculum document loaded yet.'}

Respond with thoughtful coaching questions that help the teacher think deeply about their practice. Keep responses conversational and supportive, typically 2-4 sentences with 1-2 questions.`;

                    const conversationHistory = messages
                        .filter(m => m.role !== 'system')
                        .slice(-8)
                        .map(m => ({
                            role: m.role === 'teacher' ? 'user' : 'assistant',
                            content: m.content
                        }));

                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'llama-3.3-70b-versatile',
                            messages: [
                                { role: 'system', content: systemPrompt },
                                ...conversationHistory,
                                { role: 'user', content: userMessage }
                            ],
                            temperature: 0.7,
                            max_tokens: 500
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        if (response.status === 401) {
                            throw new Error('Invalid API key. Please get a new key from console.groq.com');
                        }
                        if (response.status === 429) {
                            throw new Error('Rate limit reached. Please wait a moment and try again.');
                        }
                        throw new Error(errorData.error?.message || 'Failed to get response. Please try again.');
                    }

                    const data = await response.json();
                    return data.choices[0].message.content;
                } catch (error) {
                    console.error('AI Error:', error);
                    return `I'm having trouble connecting: ${error.message}`;
                }
            };

            const extractTextFromPDF = async (file) => {
                try {
                    const pdfjsLib = window.pdfjsLib;
                    if (!pdfjsLib) throw new Error('PDF.js not loaded');

                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    
                    let fullText = '';
                    const maxPages = Math.min(pdf.numPages, 50);
                    
                    for (let i = 1; i <= maxPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + '\n\n';
                    }
                    
                    return fullText;
                } catch (error) {
                    console.error('PDF extraction error:', error);
                    return null;
                }
            };

            const extractTextFromWord = async (file) => {
                try {
                    const mammoth = window.mammoth;
                    if (!mammoth) throw new Error('Mammoth not loaded');

                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    return result.value;
                } catch (error) {
                    console.error('Word extraction error:', error);
                    return null;
                }
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const validTypes = [
                    'application/pdf',
                    'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                    'application/msword',
                    'text/plain'
                ];

                if (!validTypes.includes(file.type)) {
                    alert('Please upload a PDF, Word document (.doc, .docx), or text file.');
                    return;
                }

                setUploadedDoc({
                    name: file.name,
                    type: file.type,
                    size: file.size
                });

                addSystemMessage(`📄 Processing "${file.name}"... Please wait.`);

                let extractedText = '';

                if (file.type === 'text/plain') {
                    extractedText = await file.text();
                } else if (file.type === 'application/pdf') {
                    extractedText = await extractTextFromPDF(file);
                    if (!extractedText) {
                        addSystemMessage(`⚠️ Unable to extract text from this PDF. Please use "Paste Content" instead.`);
                        return;
                    }
                } else if (file.type.includes('word') || file.type.includes('document')) {
                    extractedText = await extractTextFromWord(file);
                    if (!extractedText) {
                        addSystemMessage(`⚠️ Unable to extract text from this Word document. Please use "Paste Content" instead.`);
                        return;
                    }
                }

                if (extractedText && extractedText.trim()) {
                    setDocContent(extractedText);
                    addSystemMessage(`✓ Successfully loaded "${file.name}"! (${Math.round(extractedText.length / 1000)}K characters)\n\nI've reviewed your curriculum unit. Ask me anything about it!`);
                } else {
                    addSystemMessage(`⚠️ No text could be extracted. Try "Paste Content" instead.`);
                }
            };

            const handlePasteContent = () => {
                if (!pasteContent.trim()) {
                    alert('Please paste some curriculum content first.');
                    return;
                }

                setDocContent(pasteContent);
                setUploadedDoc({
                    name: 'Pasted Content',
                    type: 'text/plain',
                    size: pasteContent.length
                });
                setShowPasteArea(false);
                setPasteContent('');
                
                addSystemMessage(`✓ Curriculum content loaded! (${Math.round(pasteContent.length / 1000)}K characters)\n\nI've reviewed your materials. What would you like to explore?`);
            };

            const addSystemMessage = (content) => {
                setMessages(prev => [...prev, {
                    role: 'system',
                    content: content
                }]);
            };

            const removeDocument = () => {
                setUploadedDoc(null);
                setDocContent('');
                setShowPasteArea(false);
                setPasteContent('');
                addSystemMessage('Document removed. Feel free to upload a new curriculum unit.');
            };

            const handleSetupComplete = () => {
                if (teacherContext.name && teacherContext.gradeLevel) {
                    setShowSetup(false);
                    const welcomeMsg = {
                        role: 'coach',
                        content: `Welcome, ${teacherContext.name}! I'm here to support your teaching of NGSS-aligned science curriculum at the ${teacherContext.gradeLevel} level.\n\nI approach our conversations as a thought partner, not an evaluator. My goal is to help you think deeply about your practice through reflective dialogue.\n\nYou'll notice I often respond with questions - not to be difficult, but to help you develop your own professional judgment. This dialogic approach builds your capacity for independent decision-making.\n\nWhat's on your mind today?`
                    };
                    setMessages([welcomeMsg]);
                }
            };

            const handleApiKeySubmit = () => {
                if (!apiKey.trim()) {
                    alert('Please enter an API key.');
                    return;
                }
                localStorage.setItem('ngss_ai_key', apiKey);
                setNeedsApiKey(false);
            };

            const handleSend = async () => {
                if (!input.trim()) return;

                const userMessage = {
                    role: 'teacher',
                    content: input
                };

                setMessages(prev => [...prev, userMessage]);
                const currentInput = input;
                setInput('');
                setIsTyping(true);

                try {
                    const response = await callAI(currentInput);
                    const coachMessage = {
                        role: 'coach',
                        content: response
                    };
                    
                    setMessages(prev => [...prev, coachMessage]);
                    logInteraction(currentInput, response);
                } catch (error) {
                    setMessages(prev => [...prev, {
                        role: 'coach',
                        content: 'I encountered an error. Please try again.'
                    }]);
                }
                
                setIsTyping(false);
            };

            const downloadAnalytics = () => {
                const summary = {
                    teacher: teacherContext,
                    totalInteractions: analytics.length,
                    sessionDate: new Date().toISOString(),
                    hadCurriculumDocument: !!docContent,
                    interactions: analytics
                };
                
                const dataStr = JSON.stringify(summary, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `ngss-coach-analytics-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            const shareDataForResearch = () => {
                const summary = {
                    teacher: teacherContext,
                    totalInteractions: analytics.length,
                    sessionDate: new Date().toISOString(),
                    hadCurriculumDocument: !!docContent,
                    interactions: analytics
                };
                
                const dataStr = JSON.stringify(summary, null, 2);
                
                navigator.clipboard.writeText(dataStr).then(() => {
                    alert('✓ Pilot data copied to clipboard!\n\nThank you for contributing to this research. Please email the copied data to:\n\ninfo@ngssphenomena.com\n\nYour feedback helps us refine this tool to better support science educators.');
                }).catch(() => {
                    alert('Unable to copy automatically. Please use the "Export for Me" button instead.');
                });
            };

            const resetSession = () => {
                setMessages([]);
                setAnalytics([]);
                setTeacherContext({ gradeLevel: '', subject: '', experience: '', name: '' });
                setUploadedDoc(null);
                setDocContent('');
                setShowSetup(true);
            };

            if (needsApiKey) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
                            <div className="flex items-center justify-center mb-6">
                                <div className="text-center">
                                    <div className="text-3xl font-bold text-gray-800">NGSS</div>
                                    <div className="text-2xl font-bold text-orange-500">Phenomena</div>
                                </div>
                            </div>
                            <h1 className="text-2xl font-bold text-gray-800 text-center mb-2">
                                AI Curriculum Coach
                            </h1>
                            <p className="text-gray-600 text-center mb-6 text-sm">
                                AI-powered dialogic coaching for science educators
                            </p>
                            
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                                <p className="text-sm text-blue-900 mb-3">
                                    <strong>Setup Required:</strong> This coach uses AI to provide personalized coaching. You'll need a free API key.
                                </p>
                                <p className="text-xs text-blue-700 mb-3 italic">
                                    Note: This uses Groq (not Grok from X). 
                                </p>
                                <ol className="text-xs text-blue-800 space-y-2 ml-4 list-decimal">
                                    <li>Visit <a href="https://console.groq.com" target="_blank" rel="noopener" className="underline font-medium">console.groq.com</a></li>
                                    <li>Create free account (no credit card needed)</li>
                                    <li>Go to "API Keys" and create new key</li>
                                    <li>Copy the ENTIRE key and paste below</li>
                                </ol>
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        API Key
                                    </label>
                                    <input
                                        type="password"
                                        value={apiKey}
                                        onChange={(e) => setApiKey(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono text-sm"
                                        placeholder="gsk_..."
                                    />
                                    <p className="text-xs text-gray-500 mt-2">
                                        Your key is stored locally in your browser only. We never see it.
                                    </p>
                                </div>
                                
                                <button
                                    onClick={handleApiKeySubmit}
                                    disabled={!apiKey.trim()}
                                    className="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                                >
                                    Continue to Setup
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (showSetup) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
                            <div className="flex items-center justify-center mb-6">
                                <div className="text-center">
                                    <div className="text-3xl font-bold text-gray-800">NGSS</div>
                                    <div className="text-2xl font-bold text-orange-500">Phenomena</div>
                                </div>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-800 text-center mb-2">
                                AI Curriculum Coach
                            </h1>
                            <p className="text-gray-600 text-center mb-8">
                                Your dialogic partner for science teaching excellence
                            </p>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Your Name *
                                    </label>
                                    <input
                                        type="text"
                                        value={teacherContext.name}
                                        onChange={(e) => setTeacherContext({...teacherContext, name: e.target.value})}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="e.g., Ms. Rodriguez"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Grade Level *
                                    </label>
                                    <select
                                        value={teacherContext.gradeLevel}
                                        onChange={(e) => setTeacherContext({...teacherContext, gradeLevel: e.target.value})}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    >
                                        <option value="">Select grade level</option>
                                        <option value="Elementary (K-5)">Elementary (K-5)</option>
                                        <option value="Middle School (6-8)">Middle School (6-8)</option>
                                        <option value="High School (9-12)">High School (9-12)</option>
                                    </select>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Subject Focus (Optional)
                                    </label>
                                    <input
                                        type="text"
                                        value={teacherContext.subject}
                                        onChange={(e) => setTeacherContext({...teacherContext, subject: e.target.value})}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="e.g., Life Science, Physical Science"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Teaching Experience (Optional)
                                    </label>
                                    <select
                                        value={teacherContext.experience}
                                        onChange={(e) => setTeacherContext({...teacherContext, experience: e.target.value})}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    >
                                        <option value="">Select experience level</option>
                                        <option value="First-year teacher">First-year teacher</option>
                                        <option value="1-3 years">1-3 years</option>
                                        <option value="4-7 years">4-7 years</option>
                                        <option value="8+ years">8+ years</option>
                                    </select>
                                </div>
                                
                                <button
                                    onClick={handleSetupComplete}
                                    disabled={!teacherContext.name || !teacherContext.gradeLevel}
                                    className="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                                >
                                    Start Coaching Session
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen bg-gray-50">
                    <div className="bg-white border-b border-gray-200 px-6 py-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="text-center">
                                    <div className="text-lg font-bold text-gray-800 leading-tight">NGSS</div>
                                    <div className="text-sm font-bold text-orange-500 leading-tight">Phenomena</div>
                                </div>
                                <div className="ml-3">
                                    <h1 className="text-xl font-bold text-gray-800">AI Curriculum Coach</h1>
                                    <p className="text-sm text-gray-600">
                                        Coaching {teacherContext.name} • {teacherContext.gradeLevel}
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2">
                                {uploadedDoc && (
                                    <div className="flex items-center space-x-2 px-3 py-2 bg-blue-50 border border-blue-200 rounded-lg">
                                        <span className="text-xs text-blue-700 font-medium">📄 {uploadedDoc.name.substring(0, 20)}{uploadedDoc.name.length > 20 ? '...' : ''}</span>
                                        <button
                                            onClick={removeDocument}
                                            className="text-blue-700 hover:text-blue-900 text-xs"
                                            title="Remove document"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                )}
                                <button
                                    onClick={() => fileInputRef.current?.click()}
                                    className="flex items-center space-x-2 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors"
                                    title="Upload curriculum unit"
                                >
                                    <span className="text-sm font-medium">📎 Upload Unit</span>
                                </button>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    onChange={handleFileUpload}
                                    accept=".pdf,.doc,.docx,.txt"
                                    style={{ display: 'none' }}
                                />
                                <button
                                    onClick={() => setShowPasteArea(!showPasteArea)}
                                    className="flex items-center space-x-2 px-4 py-2 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition-colors"
                                    title="Paste curriculum content"
                                >
                                    <FileText className="w-4 h-4" />
                                    <span className="text-sm font-medium">Paste Content</span>
                                </button>
                                <button
                                    onClick={shareDataForResearch}
                                    disabled={analytics.length === 0}
                                    className="flex items-center space-x-2 px-4 py-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed transition-colors"
                                    title="Share your usage data"
                                >
                                    <BarChart3 className="w-4 h-4" />
                                    <span className="text-sm font-medium">Share Pilot Data</span>
                                </button>
                                <button
                                    onClick={downloadAnalytics}
                                    disabled={analytics.length === 0}
                                    className="flex items-center space-x-2 px-4 py-2 bg-indigo-100 text-indigo-700 rounded-lg hover:bg-indigo-200 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed transition-colors"
                                >
                                    <BarChart3 className="w-4 h-4" />
                                    <span className="text-sm font-medium">Export for Me</span>
                                </button>
                                <button
                                    onClick={resetSession}
                                    className="flex items-center space-x-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors"
                                >
                                    <RefreshCw className="w-4 h-4" />
                                    <span className="text-sm font-medium">New Session</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto px-6 py-4 space-y-4">
                        {showPasteArea && (
                            <div className="max
                                -w-4xl mx-auto p-4 bg-purple-50 border border-purple-200 rounded-lg">
                                <div className="flex items-start justify-between mb-2">
                                    <div>
                                        <p className="text-sm font-medium text-purple-900">Paste Curriculum Content</p>
                                        <p className="text-xs text-purple-700 mt-1">Copy text from your curriculum document and paste it here</p>
                                    </div>
                                    <button
                                        onClick={() => setShowPasteArea(false)}
                                        className="text-purple-700 hover:text-purple-900 text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <textarea
                                    value={pasteContent}
                                    onChange={(e) => setPasteContent(e.target.value)}
                                    placeholder="Paste your curriculum unit content here..."
                                    className="w-full px-3 py-2 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none text-sm"
                                    rows="8"
                                />
                                <button
                                    onClick={handlePasteContent}
                                    disabled={!pasteContent.trim()}
                                    className="mt-2 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors text-sm font-medium"
                                >
                                    Load Curriculum Content
                                </button>
                            </div>
                        )}

                        {messages.map((message, index) => (
                            <div
                                key={index}
                                className={`flex ${message.role === 'teacher' ? 'justify-end' : 'justify-start'}`}
                            >
                                <div
                                    className={`max-w-3xl rounded-2xl px-6 py-4 ${
                                        message.role === 'teacher'
                                            ? 'bg-indigo-600 text-white'
                                            : message.role === 'system'
                                            ? 'bg-blue-50 border border-blue-200 text-blue-900'
                                            : 'bg-white border border-gray-200 text-gray-800'
                                    }`}
                                >
                                    <div className="flex items-start space-x-3">
                                        {message.role === 'coach' && (
                                            <Lightbulb className="w-5 h-5 text-indigo-600 mt-1 flex-shrink-0" />
                                        )}
                                        <p className="text-sm leading-relaxed whitespace-pre-wrap">
                                            {message.content}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        ))}
                        
                        {isTyping && (
                            <div className="flex justify-start">
                                <div className="bg-white border border-gray-200 rounded-2xl px-6 py-4">
                                    <div className="flex items-center space-x-2">
                                        <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0ms'}}></div>
                                        <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '150ms'}}></div>
                                        <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '300ms'}}></div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="bg-white border-t border-gray-200 px-6 py-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex items-end space-x-3">
                                <div className="flex-1">
                                    <textarea
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter' && !e.shiftKey) {
                                                e.preventDefault();
                                                handleSend();
                                            }
                                        }}
                                        placeholder="Share your thoughts, questions, or challenges..."
                                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                                        rows="3"
                                    />
                                </div>
                                <button
                                    onClick={handleSend}
                                    disabled={!input.trim() || isTyping}
                                    className="bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                                >
                                    <Send className="w-5 h-5" />
                                </button>
                            </div>
                            <div className="mt-3 flex items-center justify-between text-xs text-gray-500">
                                <p>Press Enter to send, Shift+Enter for new line</p>
                                <p>{analytics.length} interactions logged</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<NGSSAICoach />, document.getElementById('root'));
    </script>
</body>
</html>
